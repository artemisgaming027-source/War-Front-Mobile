name: Godot Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Android export templates and Java
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk unzip wget
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
      - name: Validate project
        run: godot --headless --editor --path . --quit
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/war-front-mobile-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: war-front-mobile-debug
          path: build/war-front-mobile-debug.apk
          if-no-files-found: error
