name: Godot Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project
        run: godot --headless --editor --path . --quit
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/war-front-mobile-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: war-front-mobile-debug
          path: build/war-front-mobile-debug.apk
          if-no-files-found: error
